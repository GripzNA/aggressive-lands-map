<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aggressive Lands — Dragonwilds Map</title>
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  :root{
    --bg:#14181f; --panel:#1c222c; --panel2:#232b37; --text:#e8edf3; --muted:#9aa6b5;
    --border:#2e3745; --accent:#ffb74d; --pill:#22303f;
  }
  body.light{
    --bg:#f2f4f7; --panel:#ffffff; --panel2:#eef1f5; --text:#1c2330; --muted:#5d6b7d;
    --border:#d9dee6; --accent:#b26a00; --pill:#e8edf3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);z-index:1000;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--pill);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:#66bb6a}
  .pill.stale .dot{background:#ffa726}
  .pill.down .dot{background:#ef5350}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
  #layout{flex:1;display:flex;min-height:0;position:relative}
  #map{flex:1;min-width:0;background:#0d1117}
  body.light #map{background:#dfe5ec}
  aside{width:300px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:900}
  .side-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .search-row{display:flex;gap:6px}
  #search,#filter-search{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
  .row-btns{display:flex;gap:6px}
  .row-btns .btn{flex:1}
  #count-line{font-size:12px;color:var(--muted)}
  .offmap-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .offmap-row input{accent-color:var(--accent)}
  #cat-list{flex:1;overflow-y:auto;padding:4px 0 12px}
  .ghead{display:flex;align-items:center;gap:8px;padding:9px 12px 7px;cursor:pointer;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);user-select:none}
  .ghead:hover{color:var(--text)}
  .ghead .arrow{display:inline-block;transition:transform .15s;font-size:10px}
  .ghead.closed .arrow{transform:rotate(-90deg)}
  .ghead .gtotal{margin-left:auto;font-weight:400;font-size:12px}
  .ghead .gcheck{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:none;margin:0}
  .gitems{padding:0 0 4px}
  .ghead.closed + .gitems{display:none}
  .cat{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 26px;cursor:pointer;font-size:14px;user-select:none}
  .cat:hover{background:var(--panel2)}
  .cat input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;flex:none}
  .cdot{width:11px;height:11px;border-radius:50%;flex:none}
  .cat .lbl{flex:1}
  .cat .n{color:var(--muted);font-size:12px}
  footer{padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);z-index:1000}
  #drawer-toggle{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;min-width:150px}
  .leaflet-popup-content .p-title{font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:7px}
  .leaflet-popup-content .p-title img{width:22px;height:22px}
  .leaflet-popup-content .p-sub{color:#888;font-size:11px}
  .leaflet-popup-content .p-raw{color:#777;font-size:11px;word-break:break-all}
  .leaflet-popup-content .p-co{color:#777;font-size:11px;margin-top:3px}
  @media (max-width:760px){
    aside{position:absolute;top:0;bottom:0;right:0;width:min(84vw,320px);transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
    aside.open{transform:none}
    #drawer-toggle{display:inline-block}
    header h1{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <h1>🗺️ Aggressive Lands — Dragonwilds Map</h1>
  <span id="pcount" class="pill down"><span class="dot"></span><span id="pcount-text">player count unavailable</span></span>
  <span class="spacer"></span>
  <button class="btn layer-btn active" data-layer="overworld">Overworld</button>
  <button class="btn layer-btn" data-layer="underground">Dowdun Underground</button>
  <button id="fit" class="btn" title="Show whole map">⤢</button>
  <button id="theme" class="btn" title="Toggle dark/light">◐</button>
  <button id="drawer-toggle" class="btn">Filters</button>
</header>
<div id="layout">
  <div id="map"></div>
  <aside id="side">
    <div class="side-head">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search markers…" autocomplete="off">
      </div>
      <div class="search-row">
        <input id="filter-search" type="search" placeholder="Find a filter…" autocomplete="off">
      </div>
      <div class="row-btns">
        <button id="show-all" class="btn">Show all</button>
        <button id="hide-all" class="btn">Hide all</button>
      </div>
      <div id="count-line">Loading…</div>
      <label class="offmap-row" title="Show markers outside the map image (distant islands, vault interiors)"><input type="checkbox" id="offmap"> Show off-map locations</label>
    </div>
    <div id="cat-list"></div>
  </aside>
</div>
<footer>Map data datamined from game files via RSDragonwilds-LiveMap (MIT). Fan-made, not affiliated with Jagex. Only locations within the mapped area are shown — vault/dungeon interiors sit outside the map in the game data.</footer>
<script src="assets/leaflet.js"></script>
<script>
"use strict";
/* Live player count: published by the Aggressive Lands Discord bot to a public gist. */
const GIST_ID = "0ec7e60e33ad0f8545010301fc795d9b";
const GIST_FILE = "players.json";

const LAYERS = {
  overworld:   { label:"Overworld",           img:"assets/map_overworld.png",
                 bounds:[[-301450,-12000],[118550,408000]] },
  underground: { label:"Dowdun Underground",  img:"assets/map_underground.png",
                 bounds:[[-58013.3,202424.2],[-24413.3,235424.2]] }
};

/* Filter groups, Map-Genie-style organization. Markers keep their own colors. */
const HEADERS = [
  { id:"locations",    label:"Locations",    color:"#4fc3f7" },
  { id:"collectibles", label:"Collectibles", color:"#f06292" },
  { id:"items",        label:"Items",        color:"#ffd54f" },
  { id:"enemies",      label:"Enemies",      color:"#e57373" },
  { id:"quests",       label:"Quests",       color:"#ba68c8" },
  { id:"other",        label:"Other",        color:"#90a4ae" },
  { id:"resources",    label:"Resources",    color:"#ffb74d" },
];
const HEADER_BY_ID = Object.fromEntries(HEADERS.map(h=>[h.id,h]));

/* Resource spawners were misclassified as monster spawns; map each to its real group. */
const SPAWNER_TARGET = { Stone:"ore", Onion:"gather", Salvage:"gather", Flax:"gather",
  "Swamp Weed":"gather", Toadflax:"gather", Snapdragon:"gather", Bone:"gather" };

const ORE_NODE_LABELS = { Copper:"Copper Ore Node", Tin:"Tin Ore Node", Iron:"Iron Ore Node",
  Coal:"Coal Node", Silver:"Silver Ore Node", Gold:"Gold Ore Node", Mithril:"Mithril Ore Node",
  Adamantite:"Adamantite Node", Runite:"Runite Deposit", Blurite:"Blurite Ore Node",
  "Rune Essence":"Rune Essence Node", Stone:"Stone", Sandstone:"Sandstone Rock",
  Limestone:"Limestone Rock", Gypsum:"Gypsum Node", Clay:"Clay Node" };
const STONE_LABELS = { Granite:"Granite Deposit", Luminite:"Luminite Deposit",
  "Soul Stone":"Soul Stone", "Dragon Tooth":"Dragon Tooth" };
const ANIMA_LABELS = { Fire:"Fire Anima", Water:"Water Anima", Air:"Air Anima", Earth:"Earth Anima",
  Nature:"Nature Anima", Astral:"Astral Anima", Law:"Law Anima", "Anima-Infused Bark":"Anima-Infused Bark" };

function prettyCamel(s){
  return String(s).replace(/_/g," ").replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/\s+/g," ").trim();
}
function prettyMonster(cls){
  const m = cls.match(/^BP_SpawnPoint_(.+?)(_C)?$/);
  const name = m ? m[1].replace(/_\d+$/,"") : cls;
  return prettyCamel(name);
}
/* Wood types + herbs from class names. */
function gatherLabel(p){
  if(p.s) return p.s;
  const n = p.n || "";
  let m = n.match(/_Tree_([A-Za-z]+?)(?:_Bare)?_(\d+)_C$/);
  if(m) return m[1] + " Tree T" + parseInt(m[2],10);
  m = n.match(/^BP_([A-Za-z]+)Bush_C$/);
  if(m) return m[1] + " Bush";
  m = n.match(/^BP_ThornyRoot_([A-Za-z]+)_C$/);
  if(m) return m[1];
  return "Gatherable";
}
/* Extra-specific labels derived from class names for vague buckets. */
function detailLabel(p){
  const n = p.n || "";
  let m;
  switch(p.c){
    case "chest": {
      m = n.match(/Tier(\d)/);
      const tier = m ? "Tier "+m[1]+" " : "";
      if(/BuriedChest/.test(n)) return tier+"Buried Chest";
      if(/RaidChest/.test(n)) return tier+"Raid Chest";
      if(/LootChest/.test(n)) return tier+"Chest";
      if(/PersonalChest/.test(n)) return "Personal Chest";
      return "Chest";
    }
    case "fishing":
      if(/_Net/.test(n)) return "Net Fishing Spot";
      if(/_Rod/.test(n)) return "Rod Fishing Spot";
      return "Fishing Spot";
    case "agility":
      m = n.match(/BP_Trap_([A-Za-z]+?)_Agility/);
      if(m) return prettyCamel(m[1])+" Trap";
      if(/MovingPlatform/.test(n)) return "Moving Platform";
      if(/CourseStarter/.test(n)) return "Course Start";
      if(/KebbitBurrow/.test(n)) return "Kebbit Burrow";
      return "Agility";
    case "teleporter":
      if(/VautEntrance/.test(n)) return /Locked/.test(n) ? "Vault Entrance (Locked)" : "Vault Entrance";
      if(/Spectral/.test(n)) return "Spectral Door";
      if(/NightmareCrucible/.test(n)) return "Nightmare Crucible Exit";
      if(/RequiresQuestStep/.test(n)) return "Quest Teleporter";
      if(/Locked/.test(n)) return "Locked Teleporter";
      return "Teleporter";
    case "shrine":
      if(/HealthShrine/.test(n)) return "Health Shrine";
      if(/BossAltar/.test(n)) return "Boss Altar";
      return "Shrine / Altar";
    case "anima":
      if(/AnimaChargePipe/.test(n)) return "Anima Pipe";
      if(/AnimaOrbDispenser/.test(n)) return "Anima Orb Dispenser";
      if(/Animal/.test(n)) return "Animal Resource";
      return null;
    case "lore": return "Lore Scrap";
    default: return null;
  }
}

/* Every POI -> {h: header id, gkey, label, color}. */
function groupOf(p){
  const c = p.c, n = p.n || "";
  // ENEMIES — specific monster spawns (kept as-is, per user request)
  if(c==="respawn" && n.includes("SpawnPoint")){
    const name = prettyMonster(n);
    return { h:"enemies", gkey:"enemies::"+name, label:name, color:"#e57373" };
  }
  // QUESTS — primary vs secondary, from class names
  if(c==="npc"){
    if(/MainQuest/i.test(n)) return { h:"quests", gkey:"quests::Primary", label:"Primary Quest", color:"#ba68c8" };
    if(/Quest/i.test(n))     return { h:"quests", gkey:"quests::Secondary", label:"Secondary Quest", color:"#ba68c8" };
    return { h:"other", gkey:"other::NPC", label:"NPC", color:"#90a4ae" };
  }
  if(c==="respawn") // graveyards (spawn points handled above)
    return { h:"locations", gkey:"locations::Graveyard", label:"Graveyard", color:"#81c784" };
  if(c==="grave")
    return { h:"locations", gkey:"locations::Graveyard", label:"Graveyard", color:"#e57373" };
  // RESOURCES — resource spawners merged into their resource type
  if(c==="spawn"){
    const sub = p.s || "Other";
    if(sub==="Stone")      return { h:"resources", gkey:"resources::Stone", label:"Stone", color:"#ffb74d" };
    const gl = sub==="Other" ? "Gatherable" : sub;
    return { h:"resources", gkey:"resources::"+gl, label:gl, color:"#9ccc65" };
  }
  if(c==="gather"){
    const label = gatherLabel(p);
    return { h:"resources", gkey:"resources::"+label, label, color:"#9ccc65" };
  }
  if(c==="ore"){
    const sub = p.s || "Other";
    const label = ORE_NODE_LABELS[sub] || sub;
    return { h:"resources", gkey:"resources::"+label, label, color:"#ffb74d" };
  }
  if(c==="anima"){
    const label = detailLabel(p) || ANIMA_LABELS[p.s] || (p.s ? p.s : "Unknown Anima");
    return { h:"resources", gkey:"resources::"+label, label, color:"#b388ff" };
  }
  if(c==="stone"){
    const sub = p.s || "Other";
    const label = STONE_LABELS[sub] || sub;
    return { h:"resources", gkey:"resources::"+label, label, color:"#a1887f" };
  }
  if(c==="geyser")
    return { h:"resources", gkey:"resources::Rune Geyser", label:"Rune Geyser", color:"#80deea" };
  // ITEMS
  if(c==="chest"){
    const label = detailLabel(p);
    return { h:"items", gkey:"items::"+label, label, color:"#ffd54f" };
  }
  // LOCATIONS
  if(c==="teleporter"){
    const label = detailLabel(p);
    return { h:"locations", gkey:"locations::"+label, label, color:"#4fc3f7" };
  }
  if(c==="lodestone")
    return { h:"locations", gkey:"locations::Lodestone", label:"Lodestone", color:"#4fc3f7" };
  if(c==="shrine"){
    const label = detailLabel(p);
    return { h:"locations", gkey:"locations::"+label, label, color:"#ff8a65" };
  }
  if(c==="agility"){
    const label = detailLabel(p);
    return { h:"locations", gkey:"locations::"+label, label, color:"#aed581" };
  }
  // OTHER
  if(c==="fishing"){
    const label = detailLabel(p);
    return { h:"other", gkey:"other::"+label, label, color:"#4db6ac" };
  }
  return null;
}

const map = L.map("map", { crs:L.CRS.Simple, renderer:L.canvas(), zoomControl:true,
                           attributionControl:false, minZoom:-10, maxZoom:3 });
let overlay = null, currentLayer = "overworld";
let POIS = [];
let groupLayers = {};        // gkey -> {lg, color}
let visibleGroups = new Set();
let collapsed = new Set(["enemies"]);  // monster list is huge; start collapsed
let searchText = "";
let filterSearch = "";
let showOffmap = false;

function inBounds(p){
  if(showOffmap) return true;
  const b = LAYERS[currentLayer].bounds;
  const lat = -p.y, lng = p.x;
  return lat>=b[0][0] && lat<=b[1][0] && lng>=b[0][1] && lng<=b[1][1];
}
function setLayer(name){
  currentLayer = name;
  document.querySelectorAll(".layer-btn").forEach(b=>b.classList.toggle("active", b.dataset.layer===name));
  if(overlay) map.removeLayer(overlay);
  const L_ = LAYERS[name];
  overlay = L.imageOverlay(L_.img, L_.bounds).addTo(map);
  map.fitBounds(L_.bounds);
  buildFilterPanel();
  rebuildMarkers();
}
function popupHtml(p, g){
  const icon = p.i ? `<img src="assets/icons/${p.i}.png" alt="" onerror="this.style.display='none'">` : "";
  const h = HEADER_BY_ID[g.h];
  return `<div class="p-title">${icon}<span>${escapeHtml(g.label)}</span></div>`+
         (h ? `<div class="p-sub">${escapeHtml(h.label)}</div>` : "")+
         `<div class="p-raw">${escapeHtml(p.n||"")}</div>`+
         `<div class="p-co">${(p.x/100).toFixed(1)}, ${(p.y/100).toFixed(1)} m</div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function matches(p, g){
  if(!searchText) return true;
  const h = HEADER_BY_ID[g.h];
  const hay = (g.label+" "+(p.s||"")+" "+(p.n||"")+" "+(h?h.label:"")).toLowerCase();
  return hay.includes(searchText);
}
/* Groups present on the current layer (in-bounds), with live counts. */
function layerGroups(){
  const groups = new Map(); // gkey -> {h,label,color,count}
  for(const p of POIS){
    if(p.l!==currentLayer || !inBounds(p)) continue;
    const g = groupOf(p);
    if(!g) continue;
    let e = groups.get(g.gkey);
    if(!e){ e = { h:g.h, label:g.label, color:g.color, count:0 }; groups.set(g.gkey, e); }
    e.count++;
  }
  return groups;
}
function rebuildMarkers(){
  const groups = layerGroups();
  let shown = 0;
  for(const [gkey, g] of groups){
    let rec = groupLayers[gkey];
    if(rec){ rec.lg.clearLayers(); map.removeLayer(rec.lg); }
    const lg = L.layerGroup(); groupLayers[gkey] = { lg, color:g.color };
    if(visibleGroups.has(gkey)){
      for(const p of POIS){
        if(p.l!==currentLayer || !inBounds(p)) continue;
        const pg = groupOf(p);
        if(!pg || pg.gkey!==gkey || !matches(p, pg)) continue;
        L.circleMarker([-p.y, p.x], { radius:5, weight:1, color:g.color,
            fillColor:g.color, fillOpacity:0.75 })
          .bindPopup(popupHtml(p, pg)).addTo(lg);
        shown++;
      }
      lg.addTo(map);
    }
  }
  for(const k of Object.keys(groupLayers)) if(!groups.has(k)){ map.removeLayer(groupLayers[k].lg); delete groupLayers[k]; }
  document.getElementById("count-line").textContent =
    shown.toLocaleString()+" locations shown · "+LAYERS[currentLayer].label;
}
function buildFilterPanel(){
  const groups = layerGroups();
  const byHeader = new Map();
  for(const [gkey, g] of groups){
    if(!byHeader.has(g.h)) byHeader.set(g.h, []);
    byHeader.get(g.h).push({ gkey, ...g });
  }
  for(const items of byHeader.values()) items.sort((a,b)=>b.count-a.count);
  const list = document.getElementById("cat-list");
  list.innerHTML = "";
  for(const h of HEADERS){
    const items = byHeader.get(h.id);
    if(!items || !items.length) continue;
    let shown = items;
    if(filterSearch){
      const hMatch = h.label.toLowerCase().includes(filterSearch);
      shown = items.filter(it => hMatch || it.label.toLowerCase().includes(filterSearch));
      if(!shown.length) continue;
    }
    const total = items.reduce((s,i)=>s+i.count,0);
    const isClosed = filterSearch ? false : collapsed.has(h.id);
    const head = document.createElement("div");
    head.className = "ghead"+(isClosed?" closed":"");
    const visCount = items.filter(it=>visibleGroups.has(it.gkey)).length;
    head.innerHTML = `<span class="arrow">▼</span><span class="cdot" style="background:${h.color}"></span>`+
      `<span>${escapeHtml(h.label)}</span>`+
      `<input type="checkbox" class="gcheck" title="Toggle all ${escapeHtml(h.label)}">`+
      `<span class="gtotal">${total.toLocaleString()}</span>`;
    const gcheck = head.querySelector(".gcheck");
    gcheck.checked = visCount===items.length;
    gcheck.indeterminate = visCount>0 && visCount<items.length;
    gcheck.addEventListener("click", e=>e.stopPropagation());
    gcheck.addEventListener("change", e=>{
      for(const it of items){
        e.target.checked ? visibleGroups.add(it.gkey) : visibleGroups.delete(it.gkey);
      }
      buildFilterPanel(); rebuildMarkers();
    });
    head.addEventListener("click", ()=>{
      collapsed.has(h.id) ? collapsed.delete(h.id) : collapsed.add(h.id);
      head.classList.toggle("closed");
    });
    list.appendChild(head);
    const wrap = document.createElement("div");
    wrap.className = "gitems";
    for(const it of shown){
      const row = document.createElement("label");
      row.className = "cat";
      row.innerHTML = `<input type="checkbox" ${visibleGroups.has(it.gkey)?"checked":""}>`+
        `<span class="cdot" style="background:${it.color}"></span>`+
        `<span class="lbl">${escapeHtml(it.label)}</span><span class="n">${it.count.toLocaleString()}</span>`;
      row.querySelector("input").addEventListener("change", e=>{
        e.target.checked ? visibleGroups.add(it.gkey) : visibleGroups.delete(it.gkey);
        rebuildMarkers();
      });
      wrap.appendChild(row);
    }
    list.appendChild(wrap);
  }
}

/* ---- live player count ---- */
let lastGood = null;
async function refreshCount(){
  const pill = document.getElementById("pcount"), txt = document.getElementById("pcount-text");
  try{
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers:{ "Accept":"application/vnd.github+json" } });
    if(!r.ok) throw new Error("http "+r.status);
    const g = await r.json();
    const data = JSON.parse(g.files[GIST_FILE].content);
    lastGood = data;
    txt.textContent = `${data.players} / ${data.max} players online`;
    pill.className = "pill";
  }catch(e){
    if(lastGood){
      txt.textContent = `${lastGood.players} / ${lastGood.max} players online`;
      pill.className = "pill stale";
    }else{
      txt.textContent = "player count unavailable";
      pill.className = "pill down";
    }
  }
}

/* ---- wire up ---- */
document.querySelectorAll(".layer-btn").forEach(b=>b.addEventListener("click", ()=>setLayer(b.dataset.layer)));
document.getElementById("fit").addEventListener("click", ()=>map.fitBounds(LAYERS[currentLayer].bounds));
document.getElementById("theme").addEventListener("click", ()=>document.body.classList.toggle("light"));
document.getElementById("drawer-toggle").addEventListener("click", ()=>document.getElementById("side").classList.toggle("open"));
document.getElementById("offmap").addEventListener("change", e=>{
  showOffmap = e.target.checked;
  buildFilterPanel(); rebuildMarkers();
});
document.getElementById("show-all").addEventListener("click", ()=>{
  for(const k of layerGroups().keys()) visibleGroups.add(k);
  buildFilterPanel(); rebuildMarkers();
});
document.getElementById("hide-all").addEventListener("click", ()=>{
  visibleGroups.clear(); buildFilterPanel(); rebuildMarkers();
});
let searchTimer=null;
document.getElementById("search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ searchText=e.target.value.trim().toLowerCase(); rebuildMarkers(); },250);
});
let fsearchTimer=null;
document.getElementById("filter-search").addEventListener("input", e=>{
  clearTimeout(fsearchTimer);
  fsearchTimer=setTimeout(()=>{ filterSearch=e.target.value.trim().toLowerCase(); buildFilterPanel(); },200);
});

fetch("data/pois.json").then(r=>r.json()).then(pois=>{
  // Ash Logs spawners removed per user request (redundant with tree locations).
  // Traps removed per user request (agility course obstacles, not useful markers).
  // Collapse stacked duplicates: one marker per filter group per location.
  const seenLoc = new Set();
  POIS = pois.filter(p => {
    if(p.s === "Ash Logs") return false;
    if((p.n || "").includes("Trap")) return false;
    const g = groupOf(p);
    const key = p.x+","+p.y+","+p.l+","+(g ? g.gkey : "?");
    if(seenLoc.has(key)) return false;
    seenLoc.add(key);
    return true;
  });
  const seen = new Set();
  for(const p of POIS){ const g = groupOf(p); if(g && !seen.has(g.gkey)){ seen.add(g.gkey); visibleGroups.add(g.gkey); } }
  setLayer("overworld");
}).catch(err=>{
  document.getElementById("count-line").textContent = "Failed to load map data.";
  console.error(err);
});

refreshCount();
setInterval(refreshCount, 120000);
</script>
</body>
</html>
