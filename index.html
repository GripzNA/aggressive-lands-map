<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aggressive Lands — Dragonwilds Map</title>
<link rel="stylesheet" href="assets/leaflet.css">
<style>
  :root{
    --bg:#14181f; --panel:#1c222c; --panel2:#232b37; --text:#e8edf3; --muted:#9aa6b5;
    --border:#2e3745; --accent:#ffb74d; --pill:#22303f;
  }
  body.light{
    --bg:#f2f4f7; --panel:#ffffff; --panel2:#eef1f5; --text:#1c2330; --muted:#5d6b7d;
    --border:#d9dee6; --accent:#b26a00; --pill:#e8edf3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border);z-index:1000;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--pill);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:#66bb6a}
  .pill.stale .dot{background:#ffa726}
  .pill.down .dot{background:#ef5350}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.active{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
  #layout{flex:1;display:flex;min-height:0;position:relative}
  #map{flex:1;min-width:0;background:#0d1117}
  body.light #map{background:#dfe5ec}
  aside{width:290px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;z-index:900}
  .side-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  .search-row{display:flex;gap:6px}
  #search{flex:1;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px}
  .row-btns{display:flex;gap:6px}
  .row-btns .btn{flex:1}
  #count-line{font-size:12px;color:var(--muted)}
  #cat-list{flex:1;overflow-y:auto;padding:6px 0}
  .cat{display:flex;align-items:center;gap:9px;padding:7px 12px;cursor:pointer;font-size:14px;user-select:none}
  .cat:hover{background:var(--panel2)}
  .cat input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer}
  .cdot{width:11px;height:11px;border-radius:50%;flex:none}
  .cat .lbl{flex:1}
  .cat .n{color:var(--muted);font-size:12px}
  footer{padding:6px 14px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border);z-index:1000}
  #drawer-toggle{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;min-width:150px}
  .leaflet-popup-content .p-title{font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:7px}
  .leaflet-popup-content .p-title img{width:22px;height:22px}
  .leaflet-popup-content .p-raw{color:#777;font-size:11px;word-break:break-all}
  .leaflet-popup-content .p-co{color:#777;font-size:11px;margin-top:3px}
  @media (max-width:760px){
    aside{position:absolute;top:0;bottom:0;right:0;width:min(84vw,320px);transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.4)}
    aside.open{transform:none}
    #drawer-toggle{display:inline-block}
    header h1{font-size:15px}
  }
</style>
</head>
<body>
<header>
  <h1>🗺️ Aggressive Lands — Dragonwilds Map</h1>
  <span id="pcount" class="pill down"><span class="dot"></span><span id="pcount-text">player count unavailable</span></span>
  <span class="spacer"></span>
  <button class="btn layer-btn active" data-layer="overworld">Overworld</button>
  <button class="btn layer-btn" data-layer="underground">Dowdun Underground</button>
  <button id="fit" class="btn" title="Show whole map">⤢</button>
  <button id="theme" class="btn" title="Toggle dark/light">◐</button>
  <button id="drawer-toggle" class="btn">Filters</button>
</header>
<div id="layout">
  <div id="map"></div>
  <aside id="side">
    <div class="side-head">
      <div class="search-row">
        <input id="search" type="search" placeholder="Search markers…" autocomplete="off">
      </div>
      <div class="row-btns">
        <button id="show-all" class="btn">Show all</button>
        <button id="hide-all" class="btn">Hide all</button>
      </div>
      <div id="count-line">Loading…</div>
    </div>
    <div id="cat-list"></div>
  </aside>
</div>
<footer>Map data datamined from game files via RSDragonwilds-LiveMap (MIT). Fan-made, not affiliated with Jagex.</footer>
<script src="assets/leaflet.js"></script>
<script>
"use strict";
/* Live player count: published by the Aggressive Lands Discord bot to a public gist. */
const GIST_ID = "0ec7e60e33ad0f8545010301fc795d9b";
const GIST_FILE = "players.json";

const LAYERS = {
  overworld:   { label:"Overworld",           img:"assets/map_overworld.png",
                 bounds:[[-301450,-12000],[118550,408000]] },
  underground: { label:"Dowdun Underground",  img:"assets/map_underground.png",
                 bounds:[[-58013.3,202424.2],[-24413.3,235424.2]] }
};

const map = L.map("map", { crs:L.CRS.Simple, renderer:L.canvas(), zoomControl:true,
                           attributionControl:false, minZoom:-4, maxZoom:2 });
let overlay = null, currentLayer = "overworld";
let POIS = [], CATS = [];
let catGroups = {};          // catId -> L.layerGroup
let visibleCats = new Set(); // catIds currently enabled
let searchText = "";

function setLayer(name){
  currentLayer = name;
  document.querySelectorAll(".layer-btn").forEach(b=>b.classList.toggle("active", b.dataset.layer===name));
  if(overlay) map.removeLayer(overlay);
  const L_ = LAYERS[name];
  overlay = L.imageOverlay(L_.img, L_.bounds).addTo(map);
  map.fitBounds(L_.bounds);
  rebuildMarkers();
}
function popupHtml(p, cat){
  const icon = p.i ? `<img src="assets/icons/${p.i}.png" alt="" onerror="this.style.display='none'">` : "";
  const title = p.s || cat.label;
  return `<div class="p-title">${icon}<span>${escapeHtml(title)}</span></div>`+
         `<div class="p-raw">${escapeHtml(p.n||"")}</div>`+
         `<div class="p-co">${(p.x/100).toFixed(1)}, ${(p.y/100).toFixed(1)} m</div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function matches(p, cat){
  if(!searchText) return true;
  const hay = ((p.s||"")+" "+(p.n||"")+" "+cat.label).toLowerCase();
  return hay.includes(searchText);
}
function rebuildMarkers(){
  let shown = 0;
  for(const cat of CATS){
    let g = catGroups[cat.id];
    if(g){ g.clearLayers(); map.removeLayer(g); }
    g = L.layerGroup(); catGroups[cat.id] = g;
    if(visibleCats.has(cat.id)){
      for(const p of POIS){
        if(p.l!==currentLayer || p.c!==cat.id || !matches(p,cat)) continue;
        L.circleMarker([-p.y, p.x], { radius:5, weight:1, color:cat.color,
            fillColor:cat.color, fillOpacity:0.75 })
          .bindPopup(popupHtml(p,cat)).addTo(g);
        shown++;
      }
      g.addTo(map);
    }
  }
  document.getElementById("count-line").textContent =
    shown.toLocaleString()+" locations shown · "+LAYERS[currentLayer].label;
}
function buildFilterPanel(){
  const list = document.getElementById("cat-list");
  list.innerHTML = "";
  for(const cat of CATS){
    const row = document.createElement("label");
    row.className = "cat";
    row.innerHTML = `<input type="checkbox" ${visibleCats.has(cat.id)?"checked":""}>`+
      `<span class="cdot" style="background:${cat.color}"></span>`+
      `<span class="lbl">${escapeHtml(cat.label)}</span><span class="n">${cat.count}</span>`;
    row.querySelector("input").addEventListener("change", e=>{
      e.target.checked ? visibleCats.add(cat.id) : visibleCats.delete(cat.id);
      rebuildMarkers();
    });
    list.appendChild(row);
  }
}

/* ---- live player count ---- */
let lastGood = null;
async function refreshCount(){
  const pill = document.getElementById("pcount"), txt = document.getElementById("pcount-text");
  try{
    const r = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers:{ "Accept":"application/vnd.github+json" } });
    if(!r.ok) throw new Error("http "+r.status);
    const g = await r.json();
    const data = JSON.parse(g.files[GIST_FILE].content);
    lastGood = data;
    txt.textContent = `${data.players} / ${data.max} players online`;
    pill.className = "pill";
  }catch(e){
    if(lastGood){
      txt.textContent = `${lastGood.players} / ${lastGood.max} players online`;
      pill.className = "pill stale";
    }else{
      txt.textContent = "player count unavailable";
      pill.className = "pill down";
    }
  }
}

/* ---- wire up ---- */
document.querySelectorAll(".layer-btn").forEach(b=>b.addEventListener("click", ()=>setLayer(b.dataset.layer)));
document.getElementById("fit").addEventListener("click", ()=>map.fitBounds(LAYERS[currentLayer].bounds));
document.getElementById("theme").addEventListener("click", ()=>document.body.classList.toggle("light"));
document.getElementById("drawer-toggle").addEventListener("click", ()=>document.getElementById("side").classList.toggle("open"));
document.getElementById("show-all").addEventListener("click", ()=>{ CATS.forEach(c=>visibleCats.add(c.id)); buildFilterPanel(); rebuildMarkers(); });
document.getElementById("hide-all").addEventListener("click", ()=>{ visibleCats.clear(); buildFilterPanel(); rebuildMarkers(); });
let searchTimer=null;
document.getElementById("search").addEventListener("input", e=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{ searchText=e.target.value.trim().toLowerCase(); rebuildMarkers(); },250);
});

Promise.all([
  fetch("data/categories.json").then(r=>r.json()),
  fetch("data/pois.json").then(r=>r.json())
]).then(([cats, pois])=>{
  CATS = cats; POIS = pois;
  CATS.forEach(c=>visibleCats.add(c.id));
  buildFilterPanel();
  setLayer("overworld");
}).catch(err=>{
  document.getElementById("count-line").textContent = "Failed to load map data.";
  console.error(err);
});

refreshCount();
setInterval(refreshCount, 120000);
</script>
</body>
</html>
